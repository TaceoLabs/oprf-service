[package]
name = "taceo-oprf-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Shared database storage layer for TACEO:OPRF"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cryptography", "mpc", "oprf"]
publish = true

[dependencies]
async-trait = { workspace = true }
aes-gcm = { workspace = true, features = ["zeroize"] }
alloy = { workspace = true }
ark-serialize = { workspace = true }
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
backon = { workspace = true, features = ["std"], optional = true }
oprf-core = { package = "taceo-oprf-core", path = "../oprf-core", version = "0.6", optional = true }
oprf-types = { package = "taceo-oprf-types", path = "../oprf-types", version = "0.16" }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = [
  "migrate",
  "postgres",
  "runtime-tokio",
], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
ark-babyjubjub = { workspace = true }
ark-ec = { workspace = true }
eyre = { workspace = true }
nodes-common = { workspace = true, features = ["postgres", "test-utils"] }
oprf-core = { package = "taceo-oprf-core", path = "../oprf-core", version = "0.6" }
rand = { workspace = true }
ruint = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
postgres = ["dep:backon", "dep:oprf-core", "dep:sqlx", "dep:tokio", "dep:tracing"]
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
test-utils = ["postgres"]

[lints]
workspace = true
