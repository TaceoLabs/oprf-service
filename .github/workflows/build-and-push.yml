name: Build and Push

# Reproducible image pipeline: two independent runners build the image with
# no cache, the manifest digests must match, and only then is the OCI layout
# pushed as-is (crane preserves blobs, so the registry digest equals the
# locally computed one). linux/amd64 only.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Name of the Docker image to build and push'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
    secrets:
      AWS_ARCHIVE_ROLE:
        description: 'AWS role used for the SBOM upload role assumption'
        required: true
      AWS_S3_BUCKET:
        description: 'S3 bucket name used for SBOM uploads'
        required: true

env:
  REGISTRY: ghcr.io
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  # BuildKit upgrades can change image config fields and layer compression and
  # therefore digests; pin it so rebuilds stay comparable over time.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea


jobs:
  build:
    name: build (${{ matrix.builder }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: primary
            runner: ubuntu-latest
          - builder: verify
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          image_name="${GITHUB_REPOSITORY,,}/${{ inputs.image-name }}"
          echo "IMAGE_NAME=${image_name,,}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: lfs
        run: git lfs pull

      - name: Source date epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # Using https://github.com/marketplace/actions/docker-metadata-action
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          flavor: |
            latest=false

          tags: |
            type=sha,format=long
            type=match,pattern=^${{ inputs.image-name }}-(v\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^${{ inputs.image-name }}-(v\d+\.\d+\.\d+)-(dev).*$,group=2

          # Labels end up in the image config and thus in the digest: the
          # default `created` label is the wall clock, pin it to the commit date.
          labels: |
            org.opencontainers.image.title=${{ inputs.image-name }}
            org.opencontainers.image.description=Docker image for ${{ inputs.image-name }} from ${{ github.repository_owner }}/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]' tz='UTC'}}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            GIT_HASH=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/oci,tar=false,rewrite-timestamp=true,force-compression=true,oci-mediatypes=true

      - name: Record manifest digest
        shell: bash
        run: |
          digest="$(jq -r '.manifests[0].digest' "${{ runner.temp }}/oci/index.json")"
          [[ "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]] || { echo "bad digest: $digest" >&2; exit 1; }
          echo "$digest" | tee "${{ runner.temp }}/digest-${{ matrix.builder }}.txt"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image-name }}-digest-${{ matrix.builder }}
          path: ${{ runner.temp }}/digest-${{ matrix.builder }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload OCI layout
        if: matrix.builder == 'primary'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image-name }}-oci
          path: ${{ runner.temp }}/oci
          if-no-files-found: error
          retention-days: 1

      - name: Save tags
        if: matrix.builder == 'primary'
        shell: bash
        run: |
          printf '%s\n' '${{ steps.meta.outputs.tags }}' > "${{ runner.temp }}/tags.txt"
          echo "$SOURCE_DATE_EPOCH" > "${{ runner.temp }}/source-date-epoch.txt"

      - name: Upload tags
        if: matrix.builder == 'primary'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image-name }}-tags
          path: |
            ${{ runner.temp }}/tags.txt
            ${{ runner.temp }}/source-date-epoch.txt
          if-no-files-found: error
          retention-days: 1

  push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.image-name }}-*
          path: ${{ runner.temp }}/in

      - name: Verify both builders produced the same digest
        shell: bash
        run: |
          cd "${{ runner.temp }}/in"
          primary="$(cat ${{ inputs.image-name }}-digest-primary/digest-primary.txt)"
          verify="$(cat ${{ inputs.image-name }}-digest-verify/digest-verify.txt)"
          echo "primary: $primary"
          echo "verify:  $verify"
          if [[ "$primary" != "$verify" ]]; then
            echo "::error::Image is not reproducible across runners; refusing to push" >&2
            exit 1
          fi
          echo "EXPECTED_DIGEST=$primary" >> "$GITHUB_ENV"
          echo "OCI_DIR=${{ runner.temp }}/in/${{ inputs.image-name }}-oci" >> "$GITHUB_ENV"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: oci-dir:${{ env.OCI_DIR }}
          format: spdx-json
          artifact-name: ${{ inputs.image-name }}-amd64-sbom.spdx.json
          output-file: ${{ runner.temp }}/amd64-sbom.spdx.json
          upload-artifact: true

      - name: Run vulnerability scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: ${{ runner.temp }}/amd64-sbom.spdx.json
          fail-build: true
          output-format: table
          severity-cutoff: critical

      - name: Set up crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Log in to the Github Container registry
        run: crane auth login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI layout (blobs preserved, digest unchanged)
        shell: bash
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            crane push "$OCI_DIR" "$tag"
            pushed="$(crane digest "$tag")"
            echo "$tag -> $pushed"
            if [[ "$pushed" != "$EXPECTED_DIGEST" ]]; then
              echo "::error::Registry digest $pushed differs from built digest $EXPECTED_DIGEST" >&2
              exit 1
            fi
          done < "${{ runner.temp }}/in/${{ inputs.image-name }}-tags/tags.txt"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### ${{ inputs.image-name }}"
            echo
            echo "Reproducible digest (two runners agreed): \`$EXPECTED_DIGEST\`"
            echo
            echo "Rebuild: \`SOURCE_DATE_EPOCH=$(cat "${{ runner.temp }}/in/${{ inputs.image-name }}-tags/source-date-epoch.txt") docker buildx build --platform linux/amd64 --provenance=false --sbom=false --no-cache --build-arg GIT_HASH=${{ github.sha }} --output type=oci,dest=out,tar=false,rewrite-timestamp=true,force-compression=true,oci-mediatypes=true -f ${{ inputs.dockerfile }} .\` with BuildKit \`${{ env.BUILDKIT_IMAGE }}\` and the labels from this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  upload-sbom:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs:
      - push
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ARCHIVE_ROLE }}
          aws-region: eu-central-1

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/sboms
          pattern: "*.spdx.json"
          merge-multiple: true

      - name: Upload file to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # Rename file to include short git sha
          PREFIX="$(echo ${{ github.sha }} | cut -c1-7)"

          cd ${{ runner.temp }}/sboms
          for file in *; do
            [ -f "$file" ] && mv "$file" "${PREFIX}_${file}"
          done
          aws s3 sync "${{ runner.temp }}/sboms" "s3://${AWS_S3_BUCKET}/${{ inputs.image-name }}/"
