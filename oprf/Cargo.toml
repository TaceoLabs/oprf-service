[package]
name = "taceo-oprf"
version = "0.19.0"
edition.workspace = true
rust-version.workspace = true
description = "Everything you need to use TACEO:OPRF"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cryptography", "mpc", "oprf"]
publish = true

[dependencies]
oprf-client = { package = "taceo-oprf-client", path = "../oprf-client", version = "0.10.8", optional = true }
oprf-core = { package = "taceo-oprf-core", path = "../oprf-core", version = "0.6.3", default-features = false, optional = true }
oprf-dev-client = { package = "taceo-oprf-dev-client", path = "../oprf-dev-client", version = "0.11.2", optional = true }
oprf-service = { package = "taceo-oprf-service", path = "../oprf-service", version = "0.19.4", default-features = false, optional = true }
oprf-types = { package = "taceo-oprf-types", path = "../oprf-types", version = "0.16.3", default-features = false, optional = true }

alloy = { workspace = true, features = ["contract", "node-bindings", "provider-http", "provider-ws", "rpc-types-eth", "signer-local", "sol-types"], optional = true }
eyre = { workspace = true, optional = true }
nodes-common = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []

anvil = ["chain", "dep:alloy", "dep:eyre", "dep:serde_json", "types"]
client = ["dep:oprf-client"]
core = ["dep:oprf-core"]
dev-client = ["client", "dep:oprf-dev-client"]
nodes-common = ["dep:nodes-common"]
service = ["dep:oprf-service"]
types = ["dep:oprf-types"]

# oprf-types
chain = ["oprf-types?/chain"]
# nodes-common
nodes-common-api = ["nodes-common/api"]
nodes-common-axum-test = ["nodes-common/axum-test"]
nodes-common-middleware = ["nodes-common/middleware"]
nodes-common-postgres = ["nodes-common/postgres"]
nodes-common-serde = ["nodes-common/serde"]
nodes-common-signer-aws = ["nodes-common/signer-aws"]
nodes-common-signer-gcp = ["nodes-common/signer-gcp"]
nodes-common-signer-local = ["nodes-common/signer-local"]
nodes-common-test-utils = ["nodes-common/test-utils"]
nodes-common-unkey = ["nodes-common/unkey"]
nodes-common-web3 = ["nodes-common/web3"]
nodes-common-web3-asserter = ["nodes-common-web3", "nodes-common/web3-asserter"]
# --- forwarded transitive features ---
# oprf-service, nodes-common
postgres = ["nodes-common?/postgres", "oprf-service?/postgres"]

full = [
  "chain",
  "client",
  "core",
  "dev-client",
  "nodes-common",
  "postgres",
  "service",
  "types",
]

[lints]
workspace = true
